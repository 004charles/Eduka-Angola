{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdukAngola | Candidatura Enviada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --play-bg: #0f172a;
            --play-primary: #7c3aed;
            --play-card: rgba(30, 41, 59, 0.7);
            --play-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--play-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            background: var(--play-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--play-border);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
        }

        .success-icon {
            font-size: 64px;
            color: #10b981;
            margin-bottom: 25px;
        }

        h2 { font-weight: 800; margin-bottom: 15px; }
        p { opacity: 0.7; line-height: 1.6; margin-bottom: 30px; }

        .btn-home {
            background: var(--play-primary);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            display: inline-block;
            transition: 0.3s;
        }
        .btn-home:hover { transform: translateY(-2px); opacity: 0.9; color: white; }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2>Candidatura Recebida!</h2>
        <p>
            Obrigado por se candidatar à nossa equipe de instrutores. <br>
            A administração irá revisar seu perfil e, caso aprovado, você receberá um e-mail de confirmação para acessar o seu dashboard.
        </p>
        <a href="/" class="btn-home">Voltar para a Home</a>
    </div>
</body>
</html>
