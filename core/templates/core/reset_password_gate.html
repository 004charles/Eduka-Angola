{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE }}">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Edukangola | {% trans "Nova Senha" %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    {% include 'include/css.html' %}
    
    <style>
        :root {
            --color-primary: #7c3aed;
            --color-secondary: #ec4899;
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        body.active-dark-mode {
            --glass-bg: rgba(15, 23, 42, 0.9);
        }

        .landing-gate-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 20px;
        }

        body.active-dark-mode .landing-gate-wrapper {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .gate-container {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 50px;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .gate-logo {
            width: 120px;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }

        .form-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #475569;
        }

        .form-control-custom {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
        }

        .btn-gate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, var(--color-primary), var(--color-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="landing-gate-wrapper">
        <div class="gate-container">
            <img src="{% static 'assets/images/logo/Eduka-removebg-preview.png' %}" alt="Edukangola" class="gate-logo">
            <h2 class="form-title">{% trans "Definir Nova Senha" %}</h2>
            <p class="form-subtitle">{% trans "Crie uma senha forte para proteger a sua conta." %}</p>
            
            {% if error %}
            <div class="alert alert-danger" style="font-size: 13px; border-radius: 8px; margin-bottom: 20px;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>{% trans "Nova Senha" %}</label>
                    <input name="senha" type="password" class="form-control-custom" placeholder="••••••••" required minlength="8">
                </div>
                <div class="form-group">
                    <label>{% trans "Confirmar Nova Senha" %}</label>
                    <input name="confirmar_senha" type="password" class="form-control-custom" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-gate">
                    {% trans "Atualizar Senha e Entrar" %}
                </button>
            </form>
        </div>
    </div>
</body>
</html>
