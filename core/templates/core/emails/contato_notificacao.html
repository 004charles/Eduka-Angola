<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #eee;
            padding: 20px;
        }
        .header {
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .content {
            margin-bottom: 30px;
        }
        .field {
            margin-bottom: 10px;
        }
        .label {
            font-weight: bold;
            color: #555;
        }
        .signature {
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
            color: #777;
        }
        .logo {
            max-width: 150px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body class="active-dark-mode">
    <div class="email-container">
        <div class="header">
            <h2>Nova Mensagem de Contacto - Eduka-Angola</h2>
        </div>
        
        <div class="content">
            <div class="field">
                <span class="label">Nome:</span> {{ nome }}
            </div>
            <div class="field">
                <span class="label">E-mail:</span> {{ email }}
            </div>
            <div class="field">
                <span class="label">Assunto:</span> {{ assunto }}
            </div>
            <div class="field">
                <span class="label">Mensagem:</span><br>
                <p style="white-space: pre-wrap;">{{ mensagem }}</p>
            </div>
        </div>

        <div class="signature">
            {% if logo_url %}
                <img src="{{ logo_url }}" alt="Eduka-Angola Logo" class="logo">
            {% endif %}
            <p>
                <strong>{{ empresa_nome }}</strong><br>
                {{ endereco|linebreaksbr }}<br>
                Telefone: {{ telefone }}<br>
                E-mail: {{ email_contato }}<br>
                <a href="{{ site_url }}">www.edukangola.com</a>
            </p>
        </div>
    </div>
</body>
</html>
