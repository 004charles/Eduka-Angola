{% load i18n %}
<div class="rbt-brand-area bg-color-white ptb--40">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-12">
                <div class="section-title text-center mb--20">
                    <p class="description" style="font-weight: 600; color: #475569; letter-spacing: 0.5px; text-transform: uppercase; font-size: 13px;">{% trans "Aprenda com os melhores Centros de Formação e Instituições do País" %}</p>
                </div>
            </div>
        </div>
        <div class="row align-items-center">
            <div class="col-lg-12">
                <div class="swiper partner-swiper-activation">
                    <div class="swiper-wrapper">
                        {% for centro in centros_destaque %}
                        <div class="swiper-slide text-center" style="display: flex; justify-content: center; align-items: center; height: 80px; padding: 10px;">
                            <a href="{% url 'cursos_por_centro' centro.id %}" class="partner-logo-link">
                                {% if centro.perfil.imagem %}
                                    <img src="{{ centro.perfil.imagem.url }}" alt="{{ centro.nome }}" style="max-height: 50px; max-width: 140px; object-fit: contain;">
                                {% else %}
                                    <h5 style="color: #64748b; font-size: 16px; font-weight: 700; margin: 0; font-family: 'Inter', sans-serif;">{{ centro.nome|truncatechars:20 }}</h5>
                                {% endif %}
                            </a>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .partner-logo-link {
        display: block; 
        opacity: 0.6; 
        transition: all 0.3s ease; 
        filter: grayscale(100%);
    }
    .partner-logo-link:hover {
        opacity: 1 !important;
        filter: grayscale(0%) !important;
        transform: scale(1.05);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if(typeof Swiper !== 'undefined') {
            new Swiper(".partner-swiper-activation", {
                slidesPerView: 3,
                spaceBetween: 30,
                loop: true,
                autoplay: { delay: 3000, disableOnInteraction: false },
                breakpoints: {
                    0: { slidesPerView: 2, spaceBetween: 20 },
                    576: { slidesPerView: 3, spaceBetween: 20 },
                    768: { slidesPerView: 4, spaceBetween: 30 },
                    992: { slidesPerView: 5, spaceBetween: 30 },
                    1200: { slidesPerView: 6, spaceBetween: 40 }
                }
            });
        }
    });
</script>
