{% load i18n %}
<div class="ptb--30">
    <div class="container">
        <div class="promo-banner-wrapper">
            <!-- Left Side: Content -->
            <div class="promo-content">
                <h3 class="promo-title">{% trans "10% de desconto em todos os cursos." %}</h3>
                <p class="promo-text">
                    {% trans "Inscreva-se online através da EdukAngola e ganhe 10% de desconto garantido em comparação com a inscrição presencial no centro de formação." %}
                </p>
                <a href="#" class="promo-link">{% trans "Saber mais" %} <i class="feather-arrow-right"></i></a>
            </div>

            <!-- Right Side: Graphic -->
            <div class="promo-graphic-container">
                <div class="promo-graphic-bg"></div>
                <div class="promo-graphic-circle">
                    <span class="promo-percentage">10%</span>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .promo-banner-wrapper {
        background-color: #03204c; /* Azul escuro igual à imagem */
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 40px 60px;
        position: relative;
        overflow: hidden;
        min-height: 200px;
    }

    .promo-content {
        max-width: 60%;
        position: relative;
        z-index: 2;
    }

    .promo-title {
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        line-height: 1.3;
    }

    .promo-text {
        color: rgba(255, 255, 255, 0.85);
        font-size: 15px;
        margin-bottom: 20px;
        line-height: 1.6;
    }

    .promo-link {
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
    }

    .promo-link:hover {
        color: #00d2ff;
    }

    /* Right side graphic */
    .promo-graphic-container {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
    }

    .promo-graphic-bg {
        position: absolute;
        right: -50px;
        width: 350px;
        height: 350px;
        background: conic-gradient(from -90deg, #00d2ff, #6c28fd, #00d2ff);
        border-radius: 50%;
        opacity: 0.9;
        /* Efeito de círculo cortado igual ao print */
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 50%, 50% 50%, 50% 0, 0 0);
    }
    
    /* Um anel tracejado em volta para dar aquele toque de progresso */
    .promo-graphic-bg::after {
        content: '';
        position: absolute;
        inset: 20px;
        border: 1px dashed rgba(255, 255, 255, 0.3);
        border-radius: 50%;
    }

    .promo-graphic-circle {
        position: relative;
        width: 140px;
        height: 140px;
        background-color: #03204c;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        /* Deslocado ligeiramente para a direita como na imagem */
        margin-right: -40px; 
    }

    .promo-percentage {
        color: #ffffff;
        font-size: 42px;
        font-weight: 800;
        line-height: 1;
    }

    /* Responsividade */
    @media (max-width: 768px) {
        .promo-banner-wrapper {
            flex-direction: column;
            padding: 30px 20px;
            text-align: center;
        }
        
        .promo-content {
            max-width: 100%;
            margin-bottom: 30px;
        }
        
        .promo-graphic-container {
            position: relative;
            width: 100%;
            height: 150px;
            right: auto;
            margin-top: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }
        
        .promo-graphic-bg {
            right: auto;
            width: 200px;
            height: 200px;
        }
        
        .promo-graphic-circle {
            margin-right: 0;
            width: 100px;
            height: 100px;
        }
        
        .promo-percentage {
            font-size: 32px;
        }
    }
</style>
