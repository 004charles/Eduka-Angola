
{% load static %}
{% load i18n %}

<!-- Start Global Map Section -->
<div class="rbt-map-area bg-color-white rbt-section-gapTop">
    <div class="container">
        <div class="row mb--40">
            <div class="col-lg-12">
                <div class="section-title text-center">
                    <span class="subtitle bg-secondary-opacity">{% trans "Geolocalização" %} 🌍</span>
                    <h2 class="title" style="font-size: 32px; font-weight: 800;">{% trans "Mapa Global de Oportunidades" %}</h2>
                    <p class="description mt--10">{% trans "Descubra centros de formação e cursos perto de si ou em qualquer parte do mundo." %}</p>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-lg-12">
                <div class="map-wrapper" style="position: relative; border-radius: 24px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--color-border);">
                    <div id="home-global-map" style="height: 500px; width: 100%;">
                        <div class="d-flex align-items-center justify-content-center h-100 bg-light">
                            <div class="text-center">
                                <div class="spinner-border text-primary mb-3" role="status"></div>
                                <p class="text-muted tracking-tight">{% trans "A carregar mapa de oportunidades..." %}</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Overlay Controls -->
                    <div class="map-overlay-controls" style="position: absolute; bottom: 20px; right: 20px; z-index: 5;">
                        <button id="btn-recenter" class="rbt-btn btn-white btn-sm shadow-sm">
                            <i class="feather-crosshair"></i> {% trans "Minha Localização" %}
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- End Global Map Section -->
