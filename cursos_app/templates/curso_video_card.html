{% load static %}
<div class="rbt-card variation-01 rbt-hover">
    <!-- Imagem Estilo Netflix (16:9) -->
    <div class="rbt-card-img ratio ratio-16x9 overflow-hidden bg-dark">
        <a href="{% url 'cursovideoapp:detalhe_curso' curso.slug %}">
            {% if curso.capa %}
                <img src="{{ curso.capa.url }}" alt="{{ curso.titulo }}" class="w-100 h-100 object-fit-cover opacity-8">
            {% else %}
                <img src="{% static 'assets/images/default-course.jpg' %}" alt="{{ curso.titulo }}" class="w-100 h-100 object-fit-cover opacity-8">
            {% endif %}
            
            <!-- Ícone de Play (Overlay) -->
            <div class="rbt-netflix-play-icon position-absolute top-50 start-50 translate-middle">
                <i class="feather-play-circle text-white" style="font-size: 50px;"></i>
            </div>
            
            <!-- Título no Overlay Inferior -->
            <div class="rbt-card-bottom position-absolute bottom-0 start-0 w-100 p-3 bg-gradient-transparent-dark">
                 <h6 class="text-white mb-0">{{ curso.titulo|truncatechars:40 }}</h6>
            </div>
        </a>
    </div>
</div>

<style>
    .bg-gradient-transparent-dark {
        background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }
    .rbt-netflix-play-icon {
        opacity: 0;
        transition: all 0.3s ease;
        transform: translate(-50%, -50%) scale(0.8);
    }
    .rbt-hover:hover .rbt-netflix-play-icon {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
    .rbt-hover:hover img {
        transform: scale(1.05);
    }
    img {
        transition: transform 0.4s ease;
    }
</style>
