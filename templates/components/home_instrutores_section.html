{% load i18n %}
<div class="rbt-team-area bg-color-extra2 rbt-section-gap" style="padding-top: 40px !important; padding-bottom: 40px !important;">
    <div class="container">
        <div class="row mb--60">
            <div class="col-lg-12">
                <div class="section-title text-center">
                    <span class="subtitle bg-primary-opacity">Instrutores</span>
                    <h2 class="title">Conheça nossos <span class="theme-gradient">Especialistas</span></h2>
                    <p class="description">Profissionais dedicados a transformar o seu futuro através do conhecimento.</p>
                </div>
            </div>
        </div>
        
        <div class="swiper instrutoresSwiper pb--60">
            <div class="swiper-wrapper">
                {% for instrutor in instrutores_lista %}
                <div class="swiper-slide">
                    <div class="rbt-team team-style-default style-three rbt-hover" style="max-width: 260px; margin: 0 auto;">
                        <div class="inner">
                            <div class="thumbnail">
                                <a href="{% url 'instrutor_detalhes' instrutor.id %}">
                                    {% if instrutor.foto %}
                                    <img src="{{ instrutor.foto.url }}" alt="{{ instrutor.nome }}" style="height: 220px; object-fit: cover;">
                                    {% else %}
                                    <img src="https://via.placeholder.com/400x400/0056D2/FFFFFF?text={{ instrutor.nome }}" alt="{{ instrutor.nome }}" style="height: 220px; object-fit: cover;">
                                    {% endif %}
                                </a>
                            </div>
                            <div class="content px-3 py-2 text-center">
                                <h4 class="title mb-0" style="font-size: 16px;"><a href="{% url 'instrutor_detalhes' instrutor.id %}">{{ instrutor.nome }}</a></h4>
                                <span class="subtitle theme-gradient" style="font-size: 12px;">{% trans "Especialista" %}</span>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
            <div class="rbt-swiper-pagination" style="bottom: 0;"></div>
        </div>
    </div>
</div>
