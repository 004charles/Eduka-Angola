<div class="rbt-course-area rbt-section-gapBottom bg-color-white" style="padding-bottom: 20px !important;">
    <div class="container">
        <div class="row g-5 align-items-center mb--20">
            <div class="col-lg-12">
                <div class="section-title text-start d-flex justify-content-between align-items-end flex-wrap gap-2">
                    <div>
                        <h3 class="title" style="font-size: 24px; font-weight: 700; margin-bottom: 5px; color: var(--color-heading);">{{ secao.config.titulo }}</h3>
                        <p class="description" style="margin-bottom: 0; font-size: 15px;">{{ secao.config.descricao }}</p>
                    </div>
                    <div class="view-all-btn">
                        <a class="rbt-btn-link" href="{% url 'catalogo_cursos' %}?secao={{ secao.config.slug }}">
                            Saber Mais <i class="feather-arrow-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="swiper dynamicCourseSwiper mb--40">
            <div class="swiper-wrapper">
                {% for curso in secao.cursos %}
                <div class="swiper-slide p-2">
                    {% include 'components/curso_card.html' with curso=curso %}
                </div>
                {% endfor %}
            </div>
            <div class="rbt-swiper-pagination" style="bottom: -15px;"></div>
        </div>
    </div>
</div>
