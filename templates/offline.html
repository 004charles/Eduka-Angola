{% extends "base.html" %}
{% load static %}

{% block title %}Sem Ligação à Internet{% endblock %}

{% block content %}
<div class="rbt-error-area bg-color-white d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="error-content text-center">
                    <div class="error-image mb--30" style="animation: pulseLogo 2s infinite;">
                        <i class="feather-wifi-off" style="font-size: 80px; color: var(--color-primary);"></i>
                    </div>
                    <h2 class="title">Estás Offline</h2>
                    <p class="description">Sem problemas! A EdukAngola PWA permite-te aceder aos conteúdos armazenados em cache quando a internet voltar.</p>
                    <a class="rbt-btn btn-gradient icon-hover mt--20" href="javascript:window.location.reload();">
                        <span class="btn-text">Tentar Ligar Novamente</span>
                        <span class="btn-icon"><i class="feather-refresh-cw"></i></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
