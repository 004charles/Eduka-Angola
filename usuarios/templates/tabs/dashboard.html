{% load static %}
<div class="rbt-dashboard-content bg-color-white rbt-shadow-box mb--60">
    <div class="content">
        <div class="section-title">
            <h4 class="rbt-title-style-3">Resumo da Sua Trajetória</h4>
        </div>
        <div class="row g-5">
            <!-- Início Cartão Único -->
            <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <div class="rbt-counterup variation-01 rbt-hover-03 rbt-border-dashed bg-primary-opacity">
                    <div class="inner">
                        <div class="rbt-round-icon bg-primary-opacity">
                            <i class="feather-book-open"></i>
                        </div>
                        <div class="content">
                            <h3 class="counter without-icon color-primary">
                                <span class="odometer" data-count="{{ total_cursos|default:0 }}">00</span>
                            </h3>
                             <span class="rbt-title-style-2 d-block">Portfólio de Formações</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Fim Cartão Único -->

            <!-- Início Cartão Único -->
            <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <div class="rbt-counterup variation-01 rbt-hover-03 rbt-border-dashed bg-secondary-opacity">
                    <div class="inner">
                        <div class="rbt-round-icon bg-secondary-opacity">
                            <i class="feather-monitor"></i>
                        </div>
                        <div class="content">
                            <h3 class="counter without-icon color-secondary">
                                <span class="odometer" data-count="{{ total_cursos_ativos|default:0 }}">00</span>
                            </h3>
                             <span class="rbt-title-style-2 d-block">Continue de Onde Parou</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Fim Cartão Único -->

            <!-- Início Cartão Único -->
            <div class="col-lg-4 col-md-4 col-sm-6 col-12">
                <div class="rbt-counterup variation-01 rbt-hover-03 rbt-border-dashed bg-violet-opacity">
                    <div class="inner">
                        <div class="rbt-round-icon bg-violet-opacity">
                            <i class="feather-award"></i>
                        </div>
                        <div class="content">
                            <h3 class="counter without-icon color-violet">
                                <span class="odometer" data-count="{{ total_certificados|default:0 }}">00</span>
                            </h3>
                             <span class="rbt-title-style-2 d-block">As Suas Conquistas Oficiais</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
