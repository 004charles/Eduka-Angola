{% include 'include/welcome_catalog_card.html' %}

{% for msg in mensagens %}
<div class="message-wrapper d-flex mb--15 {% if not msg.is_centro %}justify-content-end{% endif %}">
    <div class="message-content p--15 rounded-3 {% if not msg.is_centro %}bg-primary text-white{% else %}bg-white border{% endif %}"
        style="max-width: 70%;">
        
        {% if msg.tipo == 'IMAGEM' and msg.arquivo %}
            <div class="mb-2">
                <a href="{{ msg.arquivo.url }}" target="_blank">
                    <img src="{{ msg.arquivo.url }}" class="rounded img-fluid" alt="Imagem" style="max-height: 250px;">
                </a>
            </div>
        {% elif msg.tipo == 'ARQUIVO' and msg.arquivo %}
            <div class="mb-2 p-2 border rounded bg-light d-flex align-items-center gap-2">
                <i class="feather-file"></i>
                <span class="small truncate text-dark">{{ msg.arquivo.name|truncatechars:20 }}</span>
                <a href="{{ msg.arquivo.url }}" target="_blank" class="small text-primary"><i class="feather-download"></i></a>
            </div>
        {% endif %}

        <p class="mb-1">{{ msg.mensagem }}</p>
        <small class="{% if not msg.is_centro %}text-white-50{% else %}text-muted{% endif %}">{{ msg.data_envio|date:"H:i" }}</small>
    </div>
</div>
{% endfor %}
