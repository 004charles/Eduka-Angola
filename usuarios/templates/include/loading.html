{% load static %}
<!-- Loading Screen -->
<div class="eduka-loading-screen" id="edukaLoading">
    <img src="{% static 'assets/images/logo/logo1.png' %}" alt="EdukAngola" class="loading-logo">
</div>

<style>
.eduka-loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.3s ease;
}

.eduka-loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-logo {
    width: 140px;
    height: auto;
    animation: logoPulse 1.2s ease-in-out infinite;
}

@keyframes logoPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.04); }
}
</style>

<script>
window.addEventListener('load', function() {
    var el = document.getElementById('edukaLoading');
    if (el) {
        el.classList.add('hidden');
        setTimeout(function() { el.remove(); }, 350);
    }
});
// Fallback: remove after 2s max
setTimeout(function() {
    var el = document.getElementById('edukaLoading');
    if (el) {
        el.classList.add('hidden');
        setTimeout(function() { el.remove(); }, 350);
    }
}, 2000);
</script>
