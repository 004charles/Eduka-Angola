<style>    /* Transições Suaves de Página */
    body {
        animation: pageFadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes pageFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }
    body.page-is-leaving {
        animation: pageFadeOut 0.3s ease-in forwards !important;
    }
    @keyframes pageFadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* Splash Screen Nativo */
    .pwa-splash-screen {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #ffffff;
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease-out, visibility 0.5s;
    }
    body.active-dark-mode .pwa-splash-screen {
        background-color: var(--color-darker);
    }
    .splash-logo {
        width: 180px;
        animation: pulseLogo 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes pulseLogo {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
    }
    .splash-spinner {
        margin-top: 30px;
        width: 36px;
        height: 36px;
        border: 3px solid rgba(47, 87, 239, 0.2);
        border-top-color: var(--color-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>

<!-- PWA Standalone Styles -->
<style>
    /* Dark Mode Global Background Override (Tom do Footer) */
    body.active-dark-mode,
    body.active-dark-mode .rbt-page-wrapper,
    body.active-dark-mode .rbt-main-wrapper,
    body.active-dark-mode .bg-color-white,
    body.active-dark-mode .bg-color-extra2,
    body.active-dark-mode .bg-color-light,
    body.active-dark-mode .rbt-section-gapBottom,
    body.active-dark-mode .rbt-section-gap {
        background-color: #191919 !important;
    }
    
    body.active-dark-mode .rbt-card {
        background-color: #242424 !important; /* Slightly lighter card to stand out */
    }

    body.active-dark-mode .category-box-equal {
        background-color: #1a1a2e !important;
    }

    /* Botão de Inscrição Profissional (Global) */
    .play-btn-primary {
        background: #0f172a;
        color: #fff;
        padding: 10px 20px;
        border-radius: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-grow: 1;
        transition: 0.2s;
        text-decoration: none !important;
        border: none;
    }
    
    body.active-dark-mode .play-btn-primary {
        background: #fff;
        color: #0f172a;
    }

    .play-btn-primary:hover {
        opacity: 0.9;
        color: inherit;
    }

    /* Base Reset para PWA Mobile */
    body.is-pwa-standalone .ptb--60 { padding-top: 20px !important; padding-bottom: 20px !important; }
    body.is-pwa-standalone .ptb--40 { padding-top: 15px !important; padding-bottom: 15px !important; }
    body.is-pwa-standalone .mt--30 { margin-top: 10px !important; }
    body.is-pwa-standalone .mb--30 { margin-bottom: 10px !important; }
    body.is-pwa-standalone .mb--40 { margin-bottom: 15px !important; }
    
    /* Swipers Horizontais de Cursos (Carrossel Native) */
    body.is-pwa-standalone [class*="dynamicCourseSwiper-"] .swiper-slide,
    body.is-pwa-standalone .dynamicCourseSwiper-recomendados .swiper-slide {
        width: 185px !important;
        height: auto;
        padding: 0 5px !important;
    }
    
    /* Cartões Compactos (Netflix/Coursera Style) */
    body.is-pwa-standalone .rbt-card {
        min-height: auto !important;
        height: auto !important;
        margin-bottom: 0 !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06) !important;
        border-radius: 8px !important;
    }
    body.is-pwa-standalone .rbt-card-img {
        height: 85px !important;
    }
    body.is-pwa-standalone .rbt-card-img img {
        height: 100% !important;
        border-radius: 8px 8px 0 0 !important;
    }
    
    /* Ajustes específicos para Categorias no PWA */
    body.is-pwa-standalone .category-box-equal .inner {
        padding: 15px 10px !important;
    }
    body.is-pwa-standalone .category-box-equal .icons {
        height: 45px !important;
        margin-bottom: 10px !important;
    }
    body.is-pwa-standalone .category-box-equal .icons img {
        max-width: 45px !important;
    }
    body.is-pwa-standalone .category-box-equal .read-more-btn {
        display: none !important;
    }
    body.is-pwa-standalone .category-box-equal .content .title {
        font-size: 13px !important;
        margin-bottom: 0 !important;
    }
    body.is-pwa-standalone .rbt-card-body {
        padding: 8px !important;
    }
    body.is-pwa-standalone .rbt-card-title {
        font-size: 11px !important;
        line-height: 1.3 !important;
        min-height: 30px !important;
        margin-bottom: 4px !important;
    }
    body.is-pwa-standalone .rbt-card-title a {
        color: #1f1f25;
    }
    body.is-pwa-standalone .rbt-card-top .rating-count {
        font-size: 9px !important;
    }
    body.is-pwa-standalone .rbt-btn-link {
        font-size: 10px !important;
        margin-top: 5px;
    }
    
    /* Secções e Títulos */
    body.is-pwa-standalone .section-title .title {
        font-size: 16px !important;
    }
    body.is-pwa-standalone .section-title .description {
        display: none !important;
    }
    
    /* Ocultar botão "Ver Todos" gigante */
    body.is-pwa-standalone .view-all-btn {
        display: none !important;
    }

    /* Remover padding extra das caixas brancas dos cursos */
    body.is-pwa-standalone .bg-color-white.rbt-shadow-box {
        padding: 15px !important;
        box-shadow: none !important;
        background: transparent !important;
    }
    
    /* Ajustar a margem e título */
    body.is-pwa-standalone .section-title {
        margin-bottom: 10px !important;
    }
    body.is-pwa-standalone .mt--30 {
        margin-top: 5px !important;
    }
    
    /* Banner Modernizado */
    body.is-pwa-standalone .rbt-text-area .container > div > div > div {
        min-height: 140px !important;
        padding: 15px !important;
    }
    body.is-pwa-standalone .rbt-text-area h3 {
        font-size: 16px !important;
        margin-bottom: 8px !important;
    }
    body.is-pwa-standalone .rbt-text-area p {
        font-size: 12px !important;
        margin-bottom: 10px !important;
        max-width: 100% !important;
    }
    
    /* Ocultar apenas as setas de swiper no mobile, não o container */
    body.is-pwa-standalone .rbt-swiper-arrow,
    body.is-pwa-standalone .swiper-navigation {
        display: none !important;
    }
    
    /* Fix Swiper config in CSS override */
    @media (max-width: 767px) {
        body.is-pwa-standalone .rbt-home-banner-activation .swiper-slide {
            padding: 5px 10px !important;
        }
    }
</style>
