{% load static %}
{% load i18n %}
<!-- Start Switcher Area -->
<div id="my_switcher" class="my_switcher">
    <ul>
        <li>
            <a href="javascript: void(0);" data-theme="light" class="setColor light">
                <img src="{% static 'assets/images/about/sun-01.svg' %}" alt="Sun images"><span title="{% trans 'Light Mode' %}">
                    {% trans 'Light' %}</span>
            </a>
        </li>
        <li>
            <a href="javascript: void(0);" data-theme="dark" class="setColor dark">
                <img src="{% static 'assets/images/about/vector.svg' %}" alt="Vector Images"><span
                    title="{% trans 'Dark Mode' %}"> {% trans "Dark" %}</span>
            </a>
        </li>
    </ul>
</div>
<!-- End Switcher Area -->

<script>
    // Remove switchers duplicados na página (mantém apenas o primeiro carregado no cabeçalho)
    document.addEventListener("DOMContentLoaded", function() {
        const switchers = document.querySelectorAll('.my_switcher');
        if (switchers.length > 1) {
            for (let i = 1; i < switchers.length; i++) {
                switchers[i].remove();
            }
        }
    });
</script>
