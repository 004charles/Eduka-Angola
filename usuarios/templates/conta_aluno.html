<div class="tab-content" id="register-content">
    <form method="POST" action="{% url 'valida_cadastro_biblioteca' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="library-name">Nome da Biblioteca*</label>
            <div class="input-field">
                <i class="fas fa-library"></i>
                <input type="text" id="library-name" name="nome" placeholder="Nome oficial da biblioteca" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="library-type">Tipo de Biblioteca*</label>
                <div class="input-field">
                    <i class="fas fa-tag"></i>
                    <select id="library-type" name="tipo" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="PUBLICA">Pública</option>
                        <option value="ESCOLAR">Escolar</option>
                        <option value="UNVERSITARIA">Universitária</option>
                        <option value="ESPECIALIZADA">Especializada</option>
                        <option value="COMUNITARIA">Comunitária</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="library-code">Código (opcional)</label>
                <div class="input-field">
                    <i class="fas fa-hashtag"></i>
                    <input type="text" id="library-code" name="codigo_registro" placeholder="Código de registro">
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="library-email">Email Institucional*</label>
            <div class="input-field">
                <i class="fas fa-envelope"></i>
                <input type="email" id="library-email" name="email" placeholder="contato@biblioteca.edu.ao" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="library-phone">Telefone*</label>
            <div class="input-field">
                <i class="fas fa-phone"></i>
                <input type="tel" id="library-phone" name="telefone" placeholder="(+244) 000 000 000" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="password">Senha*</label>
            <div class="input-field">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="senha" placeholder="••••••••" required>
            </div>
        </div>
        
        <div class="form-group">
            <label for="confirm-password">Confirmar Senha*</label>
            <div class="input-field">
                <i class="fas fa-lock"></i>
                <input type="password" id="confirm-password" name="confirmar_senha" placeholder="••••••••" required>
            </div>
        </div>
        
        <div class="library-docs">
            <div class="docs-title">Documentação necessária:</div>
            <div class="doc-requirement">
                <i class="fas fa-file-alt"></i>
                <span>Documento de criação/funcionamento da biblioteca</span>
            </div>
            <div class="doc-requirement">
                <i class="fas fa-file-alt"></i>
                <span>Documento do responsável legal (BI ou Passaporte)</span>
            </div>
            <div class="doc-requirement">
                <i class="fas fa-file-alt"></i>
                <span>Registo institucional (se aplicável)</span>
            </div>
        </div>
        
        <div class="terms">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">Declaro que sou responsável por esta biblioteca e aceito os <a href="#">Termos de Adesão</a> à Rede EducAngola.</label>
        </div>
        
        <button type="submit" class="access-btn">Solicitar Integração</button>
    </form>
</div>

<div class="switch-access">
    É um usuário individual? <a href="#">Acesse como leitor</a>
</div>
