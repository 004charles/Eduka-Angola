{% extends 'base_gestor.html' %}
{% load static %}

{% block title %}{{ action }} Instrutor - {{ centro.nome }}{% endblock %}

{% block content %}
<div class="dashboard-body">
    <div class="breadcrumb mb-24">
        <ul class="flex-align gap-4">
            <li><a href="{% url 'centro_dashboard' %}"
                    class="text-gray-200 fw-normal text-15 hover-text-main-600">Dashboard</a></li>
            <li> <span class="text-gray-500 fw-normal d-flex"><i class="ph ph-caret-right"></i></span> </li>
            <li><a href="{% url 'gerenciar_instrutores' %}"
                    class="text-gray-200 fw-normal text-15 hover-text-main-600">Instrutores</a></li>
            <li> <span class="text-gray-500 fw-normal d-flex"><i class="ph ph-caret-right"></i></span> </li>
            <li><span class="text-main-600 fw-normal text-15">{{ action }}</span></li>
        </ul>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">{{ action }} Instrutor</h5>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row gy-20">
                    <div class="col-md-6">
                        <label class="form-label">Nome Completo *</label>
                        <input type="text" name="nome" class="form-control" value="{{ instrutor.nome|default:'' }}"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">E-mail *</label>
                        <input type="email" name="email" class="form-control" value="{{ instrutor.email|default:'' }}"
                            required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Área de Especialização *</label>
                        <select name="area_especializacao" class="form-select" required>
                            <option value="">Selecione</option>
                            {% for value, label in areas %}
                            <option value="{{ value }}" {% if instrutor and instrutor.area_especializacao == value %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    {% if instrutor %}
                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <div class="form-check form-switch mt-8">
                            <input class="form-check-input" type="checkbox" name="ativo" {% if instrutor.ativo %}checked{% endif %}>
                            <label class="form-check-label">Ativo</label>
                        </div>
                    </div>
                    {% endif %}
                    <div class="col-12">
                        <label class="form-label">Biografia *</label>
                        <textarea name="biografia" class="form-control" rows="5"
                            required>{{ instrutor.biografia|default:'' }}</textarea>
                    </div>
                </div>
                <div class="flex-align gap-8 mt-24">
                    <button type="submit" class="btn btn-main px-24 py-12">
                        <i class="ph ph-floppy-disk me-8"></i> Salvar
                    </button>
                    <a href="{% url 'gerenciar_instrutores' %}" class="btn btn-outline-gray px-24 py-12">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
