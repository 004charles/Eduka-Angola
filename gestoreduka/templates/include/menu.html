{% load static %}
<header class="adm-topbar">
    <div class="d-flex align-items-center gap-16">
        <!-- Toggle mobile -->
        <button type="button" class="topbar-icon-btn d-xl-none" onclick="document.getElementById('admSidebar').classList.toggle('open')">
            <i class="ph ph-list"></i>
        </button>

        <div class="search-box d-none d-sm-block">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" placeholder="Pesquisar cursos, alunos...">
        </div>
    </div>

    <div class="topbar-actions">
        <!-- Notificações -->
        <div class="dropdown">
            <button class="topbar-icon-btn" data-bs-toggle="dropdown">
                <i class="ph ph-bell"></i>
                <span class="dot"></span>
            </button>
            <div class="dropdown-menu dropdown-menu-end border-0 shadow-lg p-0 mt-2" style="width:320px;border-radius:12px;overflow:hidden;">
                <div class="p-14 border-bottom d-flex justify-content-between align-items-center" style="background:#fafafa;">
                    <span style="font-size:14px;font-weight:700;">Notificações</span>
                    <span class="badge-sm" style="background:var(--brand-50);color:var(--brand);">3 novas</span>
                </div>
                <div style="max-height:260px;overflow-y:auto;">
                    <div class="p-14 border-bottom d-flex gap-10" style="cursor:pointer;">
                        <div style="width:32px;height:32px;border-radius:8px;background:var(--brand-50);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i class="ph ph-user-plus" style="font-size:16px;color:var(--brand);"></i>
                        </div>
                        <div>
                            <p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary);">Nova inscrição recebida</p>
                            <p style="margin:0;font-size:11px;color:var(--text-muted);">Há 5 minutos</p>
                        </div>
                    </div>
                    <div class="p-14 border-bottom d-flex gap-10" style="cursor:pointer;">
                        <div style="width:32px;height:32px;border-radius:8px;background:#ecfdf5;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                            <i class="ph ph-check-circle" style="font-size:16px;color:var(--success);"></i>
                        </div>
                        <div>
                            <p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary);">Pagamento confirmado</p>
                            <p style="margin:0;font-size:11px;color:var(--text-muted);">Há 2 horas</p>
                        </div>
                    </div>
                </div>
                <div class="p-10 text-center border-top">
                    <a href="#" style="font-size:12px;font-weight:600;color:var(--brand);text-decoration:none;">Ver todas →</a>
                </div>
            </div>
        </div>

        <div style="width:1px;height:24px;background:var(--card-border);"></div>

        <!-- Profile -->
        <div class="dropdown">
            <button class="profile-btn" data-bs-toggle="dropdown">
                <img src="{% if perfil.imagem %}{{ perfil.imagem.url }}{% else %}{% static 'assets1/images/thumbs/user-img.png' %}{% endif %}" alt="">
                <div class="info d-none d-md-block">
                    <div class="name">{{ centro.nome|truncatechars:16 }}</div>
                    <div class="role">Gestor</div>
                </div>
            </button>

            <div class="dropdown-menu dropdown-menu-end profile-dropdown mt-2">
                <div class="pd-header">
                    <div class="d-flex align-items-center gap-12">
                        <img src="{% if perfil.imagem %}{{ perfil.imagem.url }}{% else %}{% static 'assets1/images/thumbs/user-img.png' %}{% endif %}" alt="">
                        <div>
                            <div class="pd-name">{{ centro.nome }}</div>
                            <div class="pd-email">{{ centro.email }}</div>
                        </div>
                    </div>
                </div>
                <div class="pd-body">
                    <a href="{% url 'configuracao_gestor' %}" class="pd-link">
                        <i class="ph ph-user-circle"></i> Meu Perfil
                    </a>
                    <a href="{% url 'gerenciar_assinatura' %}" class="pd-link">
                        <i class="ph ph-crown"></i> Assinatura
                    </a>
                    <a href="{% url 'configuracao_gestor' %}" class="pd-link">
                        <i class="ph ph-gear-six"></i> Configurações
                    </a>
                    <hr style="margin:6px 0;border-color:#f3f4f6;">
                    <a href="{% url 'logout_gestor' %}" class="pd-link danger">
                        <i class="ph ph-sign-out"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>
