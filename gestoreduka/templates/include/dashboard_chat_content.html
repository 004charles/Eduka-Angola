<!-- Header do Chat -->
<div class="px-5 py-3.5 border-b border-border flex items-center justify-between bg-accent/10">
    <div class="flex items-center gap-3">
        <div class="size-10 rounded-full bg-success/10 text-success flex items-center justify-center font-bold text-lg border border-success/20">
            {{ conversa_atual.aluno.nome|first|upper }}
        </div>
        <div class="flex flex-col leading-tight">
            <span class="text-sm font-bold text-foreground">{{ conversa_atual.aluno.nome }}</span>
            <div class="flex items-center gap-1">
                <span class="size-1.5 rounded-full bg-success"></span>
                <span class="text-[11px] text-success font-medium">Online</span>
            </div>
        </div>
    </div>
    
    <div class="flex items-center gap-2">
        <!-- Outras Opções de Chat -->
        <button class="kt-btn kt-btn-icon kt-btn-sm kt-btn-ghost text-muted-foreground hover:text-primary" title="Chamada">
            <i class="ki-filled ki-phone text-lg"></i>
        </button>
        <button class="kt-btn kt-btn-icon kt-btn-sm kt-btn-ghost text-muted-foreground hover:text-primary" title="Vídeo">
            <i class="ki-filled ki-video text-lg"></i>
        </button>
        
        <div class="w-px h-6 bg-border mx-1"></div>
        
        <!-- OPÇÃO: ELIMINAR CONVERSA -->
        <a href="{% url 'eliminar_conversa' conversa_atual.id %}" 
           onclick="return confirm('Tens a certeza que desejas eliminar permanentemente esta conversa e todo o seu histórico?')"
           class="kt-btn kt-btn-icon kt-btn-sm kt-btn-ghost text-muted-foreground hover:text-danger hover:bg-danger/10" 
           title="Eliminar Conversa">
            <i class="ki-filled ki-trash text-lg"></i>
        </a>
        
        <button class="kt-btn kt-btn-icon kt-btn-sm kt-btn-ghost text-muted-foreground hover:text-primary">
            <i class="ki-filled ki-setting-4 text-lg"></i>
        </button>
    </div>
</div>

<!-- Mensagens -->
<div id="dashboard-chat-messages" class="kt-scrollable-y grow p-5 flex flex-col gap-5 bg-muted/20" data-kt-scrollable="true">
    {% include 'include/chat_messages_fragment.html' %}
</div>
