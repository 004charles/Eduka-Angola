{% load static %}
<aside class="adm-sidebar" id="admSidebar">
    <!-- Logo -->
    <div class="logo-area">
        <img src="{% static 'assets/images/logo/Eduka-removebg-preview.png' %}" alt="Logo">
        <span class="logo-text">Eduka</span>
    </div>

    <!-- Nav principal -->
    <div class="nav-section">
        <div class="nav-label">Menu Principal</div>
        <a href="{% url 'centro_dashboard' %}" class="nav-link-item {% if request.resolver_match.url_name == 'centro_dashboard' %}active{% endif %}">
            <i class="ph ph-squares-four"></i>
            <span>Dashboard</span>
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-label">Académico</div>
        <a href="{% url 'gerenciar_alunos' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_alunos' or request.resolver_match.url_name == 'dossie_aluno' %}active{% endif %}">
            <i class="ph ph-users-three"></i>
            <span>Alunos & Dossiês</span>
        </a>
        <a href="{% url 'listar_cursos' %}" class="nav-link-item {% if request.resolver_match.url_name == 'listar_cursos' or request.resolver_match.url_name == 'criar_curso' %}active{% endif %}">
            <i class="ph ph-graduation-cap"></i>
            <span>Cursos</span>
        </a>
        <a href="{% url 'gerenciar_turmas' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_turmas' %}active{% endif %}">
            <i class="ph ph-chalkboard-teacher"></i>
            <span>Turmas & Aulas</span>
        </a>
        <a href="{% url 'gerenciar_inscricoes' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_inscricoes' %}active{% endif %}">
            <i class="ph ph-user-plus"></i>
            <span>Matrículas</span>
        </a>
        <a href="{% url 'gerenciar_instrutores' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_instrutores' %}active{% endif %}">
            <i class="ph ph-identification-badge"></i>
            <span>Instrutores</span>
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-label">Comunicação</div>
        <a href="{% url 'chat_centro' %}" class="nav-link-item {% if request.resolver_match.url_name == 'chat_centro' %}active{% endif %}">
            <i class="ph ph-chat-circle-dots"></i>
            <span>Mensagens</span>
        </a>
        <a href="{% url 'gerenciar_eventos' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_eventos' %}active{% endif %}">
            <i class="ph ph-calendar-check"></i>
            <span>Eventos</span>
        </a>
    </div>

    <div class="nav-section">
        <div class="nav-label">Administração</div>
        
        <a href="{% url 'gerenciar_financeiro' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_financeiro' %}active{% endif %}">
            <i class="ph ph-wallet"></i>
            <span>Finanças</span>
        </a>
        
        {% if request.user.tipo_usuario == 'GESTOR' %}
        <a href="{% url 'gerenciar_filiais' %}" class="nav-link-item {% if 'filiais' in request.path %}active{% endif %}">
            <i class="ph ph-buildings"></i>
            <span>Filiais</span>
        </a>
        {% endif %}
        <a href="{% url 'gerenciar_assinatura' %}" class="nav-link-item {% if request.resolver_match.url_name == 'gerenciar_assinatura' %}active{% endif %}">
            <i class="ph ph-credit-card"></i>
            <span>Assinatura</span>
        </a>
        <a href="{% url 'configuracao_gestor' %}" class="nav-link-item {% if request.resolver_match.url_name == 'configuracao_gestor' %}active{% endif %}">
            <i class="ph ph-gear-six"></i>
            <span>Configurações</span>
        </a>
    </div>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
        <a href="{% url 'logout_gestor' %}" class="nav-link-item" style="color:rgba(239,68,68,.75);">
            <i class="ph ph-sign-out"></i>
            <span>Sair</span>
        </a>
    </div>
</aside>
