{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title> GestorEduka | Cadastro centro</title>
    <link rel="stylesheet" href="{% static 'assets1/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets1/css/file-upload.css' %}">
    <link rel="stylesheet" href="{% static 'assets1/css/plyr.css' %}">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <!-- full calendar -->
    <link rel="stylesheet" href="{% static 'assets1/css/full-calendar.css' %}">
    <!-- jquery Ui -->
    <link rel="stylesheet" href="{% static 'assets1/css/jquery-ui.css' %}">
    <!-- editor quill Ui -->
    <link rel="stylesheet" href="{% static 'assets1/css/editor-quill.css' %}">
    <!-- apex charts Css -->
    <link rel="stylesheet" href="{% static 'assets1/css/apexcharts.css' %}">
    <!-- calendar Css -->
    <link rel="stylesheet" href="{% static 'assets1/css/calendar.css' %}">
    <!-- jvector map Css -->
    <link rel="stylesheet" href="{% static 'assets1/css/jquery-jvectormap-2.0.5.css' %}">
    <!-- Main css -->
    <link rel="stylesheet" href="{% static 'assets1/css/main.css' %}">
</head> 
<body>
    
<!--==================== Preloader Start ====================-->
  <div class="preloader">
    <div class="loader"></div>
  </div>
<!--==================== Preloader End ====================-->

<!--==================== Sidebar Overlay End ====================-->
<div class="side-overlay"></div>
<!--==================== Sidebar Overlay End ====================-->

    <section class="auth d-flex">
    <div class="auth-left bg-main-50 flex-center p-24">
        <img src="{% static 'assets1/images/thumbs/auth-img1.png' %}" alt="">
    </div>
    <div class="auth-right py-40 px-24 flex-center flex-column">
        <div class="auth-right__inner mx-auto w-100">
            <a href="/" class="auth-right__logo">
                <h1 style="font-size: 30px;">Bem vindo de Volta!</h1>
            </a>
            <h2 class="mb-8">Acesse sua conta 🔑</h2>
            <p class="text-gray-600 text-15 mb-32">
                Insira seu e-mail e token de acesso
            </p>

            <!-- Mensagens de alerta -->
            {% if messages %}
            <div class="mb-24">
                {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} 
                            alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="post" action="{% url 'login_gestor' %}">
                {% csrf_token %}

                <div class="mb-24">
                    <label for="email" class="form-label mb-8 h6">E-mail do Centro</label>
                    <div class="position-relative">
                        <input type="email" name="email" class="form-control py-11 ps-40" id="email" 
                               placeholder="Digite seu e-mail" required 
                               value="{{ request.POST.email|default:'' }}">
                        <span class="position-absolute top-50 translate-middle-y ms-16 text-gray-600 d-flex">
                            <i class="ph ph-envelope"></i>
                        </span>
                    </div>
                </div>
                
                <div class="mb-24">
                    <label for="senha" class="form-label mb-8 h6">Senha de acesso</label>
                    <div class="position-relative">
                        <input type="password" name="senha" class="form-control py-11 ps-40" id="senha" 
                               placeholder="Digite seu token" required>
                        <span class="toggle-password position-absolute top-50 inset-inline-end-0 me-16 translate-middle-y ph ph-eye-slash"></span>
                        <span class="position-absolute top-50 translate-middle-y ms-16 text-gray-600 d-flex">
                            <i class="ph ph-key"></i>
                        </span>
                    </div>
                    <small class="text-muted"></small>
                </div>

                <button type="submit" class="btn btn-main rounded-pill w-100">Entrar</button>

                <div class="mt-3 text-center">
                    <a href="#" class="text-main-600 hover-text-decoration-underline text-15 fw-medium">
                        Solicitar novo token
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
// Script para mostrar/ocultar token
document.addEventListener('DOMContentLoaded', function() {
    const togglePassword = document.querySelector('.toggle-password');
    const passwordInput = document.getElementById('senha');
    
    if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('ph-eye');
            this.classList.toggle('ph-eye-slash');
        });
    }
});
</script>


        <!-- Jquery js -->
    <script src="{% static 'assets1/js/jquery-3.7.1.min.js' %}"></script>
    <!-- Bootstrap Bundle Js -->
    <script src="{% static 'assets1/js/boostrap.bundle.min.js' %}"></script>
    <!-- Phosphor Js -->
    <script src="{% static 'assets1/js/phosphor-icon.js' %}"></script>
    <!-- file upload -->
    <script src="{% static 'assets1/js/file-upload.js' %}"></script>
    <!-- file upload -->
    <script src="{% static 'assets1/js/plyr.js' %}"></script>
    <!-- dataTables -->
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
    <!-- full calendar -->
    <script src="{% static 'assets1/js/full-calendar.js' %}"></script>
    <!-- jQuery UI -->
    <script src="{% static 'assets1/js/jquery-ui.js' %}"></script>
    <!-- jQuery UI -->
    <script src="{% static 'assets1/js/editor-quill.js' %}"></script>
    <!-- apex charts -->
    <script src="{% static 'assets1/js/apexcharts.min.js' %}"></script>
    <!-- jvectormap Js -->
    <script src="{% static 'assets1/js/jquery-jvectormap-2.0.5.min.js' %}"></script>
    <!-- jvectormap world Js -->
    <script src="{% static 'assets1/js/jquery-jvectormap-world-mill-en.js' %}"></script>
    
    <!-- main js -->
    <script src="{% static 'assets1/js/main.js' %}"></script>



    </body>
</html>
